homebrew_cask_appdir: /Applications
# Change default shell to zsh
default_shell_zsh: yes
# Install oh my zsh
install_oh_my_zsh: yes
# oh-my-pi version (pi coding agent extension)
oh_my_pi_version: "15.5.7"
# OpenSpec version (spec-driven development)
openspec_version: "1.3.1"
# GSD version (task-tracking pi agent)
gsd_pi_version: "1.0.2"
